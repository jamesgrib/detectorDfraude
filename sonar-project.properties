sonar.projectKey=jamesgrib_detectorDfraude
sonar.organization=jamesleonardgrijalbabolanos
sonar.host.url=https://sonarcloud.io

sonar.projectName=Fraude Detection
sonar.projectVersion=0.0.1-SNAPSHOT

# --- Backend Java ---
sonar.java.source=17
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# --- Frontend TypeScript ---
sonar.javascript.lcov.reportPaths=frontend/promptly-fluent/coverage/lcov.info

# --- Fuentes ---
sonar.sources=src/main/java,frontend/promptly-fluent/src
sonar.tests=src/test/java

# --- Exclusiones ---
sonar.exclusions=**/node_modules/**,frontend/promptly-fluent/dist/**,data/**,**/*.ps1
sonar.coverage.exclusions=src/main/java/**/*Application.java
