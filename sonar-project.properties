sonar.projectKey=jamesleonardgrijalbabolanos_fraude-detection
sonar.organization=jamesleonardgrijalbabolanos

# Excluir el frontend del análisis
sonar.exclusions=frontend/**

# Fuentes del backend
sonar.sources=src/main/java
sonar.tests=src/test/java

# Clases compiladas (requerido por el sensor de Java)
sonar.java.binaries=target/classes

# Reporte de cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Excluir clases que no necesitan cobertura
sonar.coverage.exclusions=**/config/**,**/*Application.java,**/model/**,**/repository/**,**/dto/**
